# Servicios del prototipo: el proxy HTTPS (Caddy), la aplicación web y la base de datos.
# Los valores ${...} se leen del archivo .env (ver .env.example).

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - datos_db:/var/lib/postgresql/data
    # La base no publica ningún puerto: solo la aplicación puede conectarse.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      EVIDENCIA_DIR: /datos/evidencia
    volumes:
      - evidencia:/datos/evidencia
    # La aplicación no publica su puerto: solo Caddy (en la red interna) llega a ella.
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2.11
    restart: unless-stopped
    environment:
      SITIO: ${SITIO:-localhost}
    ports:
      - "80:80"     # HTTP: redirige a HTTPS
      - "443:443"   # HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data        # autoridad certificante local y certificados
      - caddy_config:/config
    depends_on:
      - app

volumes:
  datos_db:     # datos de PostgreSQL
  evidencia:    # archivos de evidencia de las verificaciones
  caddy_datos:  # certificados de Caddy (si se borra, cambia la autoridad local)
  caddy_config:
